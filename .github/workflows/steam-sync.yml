name: Steam Background Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: steam-background-sync
  cancel-in-progress: false

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VAR_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SCHEDULER_SECRET: ${{ secrets.STEAM_SYNC_SCHEDULER_SECRET }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          supabase_url="${SECRET_SUPABASE_URL:-${VAR_SUPABASE_URL:-}}"
          if [ -z "$supabase_url" ]; then
            echo "::error::Configure o secret ou variable SUPABASE_URL no repositorio."
            exit 1
          fi

          echo "SUPABASE_URL configurada."

      - name: Trigger steam sync scheduler
        shell: bash
        run: |
          set -euo pipefail

          supabase_url="${SECRET_SUPABASE_URL:-${VAR_SUPABASE_URL:-}}"
          function_url="${supabase_url%/}/functions/v1/steam_sync_scheduler"
          response_file="$(mktemp)"

          headers=(-H "Content-Type: application/json")
          if [ -n "${SCHEDULER_SECRET:-}" ]; then
            headers+=(-H "x-cron-secret: ${SCHEDULER_SECRET}")
          fi

          http_status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 5 \
              --output "$response_file" \
              --write-out "%{http_code}" \
              -X POST \
              "${headers[@]}" \
              "$function_url"
          )"

          echo "HTTP ${http_status}"
          cat "$response_file"
          echo

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::steam_sync_scheduler retornou HTTP ${http_status}."
            exit 1
          fi
