name: Steam Background Sync

"on":
  schedule:
    # Executa a cada 4 horas (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: "0 */4 * * *"
  workflow_dispatch: # Permite execução manual

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Steam Sync
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "❌ Missing secret: SUPABASE_URL"
            exit 1
          fi

          echo "Starting Steam background sync..."
          response=$(curl --silent --show-error --location --max-time 60 --write-out "\n%{http_code}" \
            --request POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/steam_sync_scheduler" \
            --header "Content-Type: application/json" \
            --data '{"source": "github-actions"}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [[ "$http_code" =~ ^[0-9]{3}$ ]] && [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Sync triggered successfully!"
          else
            echo "❌ Sync failed with HTTP $http_code"
            exit 1
          fi
